[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 10
markers =
    known_bug: Bilinen hataları belgeleyen testler. Mevcut (yanlış) davranışı belgeler. Düzeltme sonrası bu testler ya silinir ya da tersine çevrilir.
    no_cardpool_reset: Disables automatic CardPool.reset() in conftest.py for tests that explicitly test singleton behavior.
    ai_architecture_defect: AI mimari kusurlarını belgeleyen testler - refactor sonrası xfail olmalı
